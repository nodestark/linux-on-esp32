<body>

<h1>ulinux-esp32 — browser port</h1>
<div class="sub">RV32IMAFDC + virtio-mmio, the same machine as the ESP32 firmware, running 100% in JavaScript in the browser.</div>

<div id="wrap">
	<div class="panel">
		<span id="status">loading…</span>
		<span style="flex:1"></span>
		<div class="gpio"><span class="led" id="led0"></span>gpio0<button id="btn0">toggle</button></div>
		<div class="gpio"><span class="led" id="led1"></span>gpio1<button id="btn1">toggle</button></div>
		<button id="btnReset">reset</button>
	</div>

	<div id="term" tabindex="0"></div>
	<div id="hint">click the terminal to focus and type. console is the guest's hvc0 (no local echo — the kernel itself echoes back).</div>

<script>
'use strict';

// ===== emulator core (ported from main/ulinux-esp32.c + main/cpu.c) =====
'use strict';
/* RV32IMAFDC + virtio-mmio emulator core. Ported from the ESP-IDF ulinux-esp32.c/cpu.c C sources.
 * No DOM/Node dependency here: the host environment supplies I/O via the `host` object passed to boot(). */

// ===== address map =====
const RAM_BASE      = 0x80000000;
const GUEST_RAM_SIZE = 0xf00000; // 15MB
const PLIC_BASE     = 0x40100000;
const VIRTIO8_BASE  = 0x40080000;
const SYSCON_BASE   = 0x40060000;
const UART1_BASE    = 0x40050000;
const VIRTIO4_BASE  = 0x40040000;
const VIRTIO3_BASE  = 0x40030000;
const VIRTIO2_BASE  = 0x40020000;
const VIRTIO1_BASE  = 0x40010000;
const CLINT_BASE    = 0x02000000;
const DTB_BASE      = 0x00000000;

const USER = 0, SUPERVISOR = 1, MACHINE = 3;

const INSTRUCTION_ADDRESS_MISALIGNED = 0x0, INSTRUCTION_ACCESS_FAULT = 0x1, ILLEGAL_INSTRUCTION = 0x2, BREAKPOINT = 0x3,
	LOAD_ADDRESS_MISALIGNED = 0x4, LOAD_ACCESS_FAULT = 0x5, STORE_AMO_ADDRESS_MISALIGNED = 0x6, STORE_AMO_ACCESS_FAULT = 0x7,
	ENV_CALL_FROM_UMODE = 0x8, ENV_CALL_FROM_SMODE = 0x9, ENV_CALL_FROM_MMODE = 0xb,
	INSTRUCTION_PAGE_FAULT = 0xc, LOAD_PAGE_FAULT = 0xd, STORE_AMO_PAGE_FAULT = 0xf;

const SUPERVISOR_SOFTWARE_INTERRUPT = 0x1, MACHINE_SOFTWARE_INTERRUPT = 0x3, SUPERVISOR_TIMER_INTERRUPT = 0x5,
	MACHINE_TIMER_INTERRUPT = 0x7, SUPERVISOR_EXTERNAL_INTERRUPT = 0x9, MACHINE_EXTERNAL_INTERRUPT = 0xb;

const MAX_VQUEUE_SIZE = 32;
const SZ_VIRTQ_DESC = 16;

// ===== memory =====
const ram = new Uint8Array(GUEST_RAM_SIZE);
const ramDV = new DataView(ram.buffer);
const low = new Uint8Array(4096);
const lowDV = new DataView(low.buffer);

let rootfs = null; // Uint8Array, set by boot()

function memRead32(off) { return ramDV.getUint32(off, true); }
function memWrite32(off, v) { ramDV.setUint32(off, v >>> 0, true); }
function memRead16(off) { return ramDV.getUint16(off, true); }
function memWrite16(off, v) { ramDV.setUint16(off, v & 0xffff, true); }
function memRead8(off) { return ram[off]; }
function memWrite8(off, v) { ram[off] = v & 0xff; }

// ===== cpu / csr / device state =====
const cpu = {
	pc: 0x80000000,
	xreg: new Array(32).fill(0),
	freg: new BigUint64Array(32),
	privilege: MACHINE,
	reserved: 0,
};
cpu.xreg[11] = DTB_BASE;

const csr = {
	satp: 0, // raw 32-bit (mode:1<<31 | asid:9<<22 | ppn:22)
	fflags: 0, frm: 0, fcsr: 0, misa: 0,
	mstatus: 0, sstatus: 0, mhartid: 0,
	mscratch: 0, sscratch: 0, mtvec: 0, stvec: 0,
	mcountern: 0, scounteren: 0, mie: 0, sie: 0, mip: 0, sip: 0,
	pmpaddr0: 0, pmpcfg0: 0, mepc: 0, sepc: 0, mcause: 0, scause: 0,
	mtval: 0, stval: 0, mideleg: 0, medeleg: 0,
};

const clint = { time: 0, timecmp: 0 }; // plain Numbers, 32-bit halves combined as float64 (safe up to 2^53)
const plic = { sclaim: 0 };

const uart_com_1 = { ier: 0, fcr: 0, lcr: 0, lsr: (1 << 5), isr: 0, mcr: 0, msr: 0, dll: 0, dlm: 0, thr: 0, rhr: 0, spr: 0 };

function makeVirtio(dev_id) {
	return {
		dev_id, dev_status: 0,
		dev_feat: [0, 0], dev_feat_sel: 0,
		guest_feat: [0, 0], guest_feat_sel: 0,
		int_status: 0, queue_sel: 0,
		config_space: null, // Uint8Array
		queue: [0, 1, 2].map(() => ({ num: 0, ready: 0, desc_addr: 0, driver_addr: 0, dev_addr: 0, notify: 0 })),
	};
}
const virtio1_console = makeVirtio(3);
const virtio2_blk = makeVirtio(2);
const virtio3_gpio = makeVirtio(41);
const virtio4_i2c = makeVirtio(34);
const virtio8_net = makeVirtio(1);

const gpio_level = new Uint8Array(2);

// ===== TLB =====
const TLB_SIZE = 89;
const tlbVaddr = new Uint32Array(TLB_SIZE).fill(0xFFFFFFFF);
const tlbPaddr = new Uint32Array(TLB_SIZE).fill(0xFFFFFFFF);
const tlbExcept = new Uint8Array(TLB_SIZE).fill(0xFF);

function tlbFlush() {
	tlbVaddr.fill(0xFFFFFFFF);
	tlbPaddr.fill(0xFFFFFFFF);
	tlbExcept.fill(0xFF);
}

// ===== float64 <-> raw bits (matches pack754_64/unpack754_64 in cpu.h) =====
const f64buf = new ArrayBuffer(8);
const f64view = new DataView(f64buf);
function pack754_64(d) { f64view.setFloat64(0, d, true); return f64view.getBigUint64(0, true); }
function unpack754_64(bits) { f64view.setBigUint64(0, bits, true); return f64view.getFloat64(0, true); }
function pack754_32(f) { f64view.setFloat32(0, f, true); return f64view.getUint32(0, true); }
function unpack754_32(bits) { f64view.setUint32(0, bits >>> 0, true); return f64view.getFloat32(0, true); }

const U64_MASK = 0xFFFFFFFFFFFFFFFFn;
const SIGN64 = 1n << 63n;

// ===== register field helpers =====
function RD(i) { return (i >>> 7) & 0x1f; }
function RS1(i) { return (i >>> 15) & 0x1f; }
function RS2(i) { return (i >>> 20) & 0x1f; }

function immC_sext(raw, shiftN) { return (((raw << shiftN) << 16) >> 16) >> shiftN; }

function immB(inst) {
	const raw = ((inst & 0x80000000) >>> 19) | ((inst & 0x7E000000) >>> 20) | ((inst & 0x00000F00) >>> 7) | ((inst & 0x00000080) << 4);
	return (raw << 19) >> 19;
}
function immJ(inst) {
	const raw = ((inst & 0x80000000) >>> 11) | ((inst & 0x7FE00000) >>> 20) | ((inst & 0x00100000) >>> 9) | (inst & 0x000FF000);
	return (raw << 11) >> 11;
}
function immS(inst) {
	const raw = (inst & 0xFE000000) | ((inst & 0x00000F80) << 13);
	return raw >> 20;
}
function immI(inst) { return inst >> 20; }

// ===== CSR access (replaces C's uint32_t* csr_read_) =====
function csrGet(offset) {
	switch (offset) {
		case 0x001: return csr.fflags;
		case 0x002: return csr.frm;
		case 0x003: return csr.fcsr;
		case 0x100: return csr.sstatus;
		case 0x104: return csr.sie;
		case 0x105: return csr.stvec;
		case 0x106: return csr.scounteren;
		case 0x140: return csr.sscratch;
		case 0x141: return csr.sepc;
		case 0x142: return csr.scause;
		case 0x143: return csr.stval;
		case 0x144: return csr.sip;
		case 0x180: return csr.satp;
		case 0x300: return csr.mstatus;
		case 0x301: return csr.misa;
		case 0x302: return csr.medeleg;
		case 0x303: return csr.mideleg;
		case 0x304: return csr.mie;
		case 0x305: return csr.mtvec;
		case 0x306: return csr.mcountern;
		case 0x340: return csr.mscratch;
		case 0x341: return csr.mepc;
		case 0x342: return csr.mcause;
		case 0x343: return csr.mtval;
		case 0x344: return csr.mip;
		case 0x3a0: return csr.pmpcfg0;
		case 0x3b0: return csr.pmpaddr0;
		case 0xc01: return clint.time >>> 0;
		case 0xc81: return Math.floor(clint.time / 4294967296) >>> 0;
		case 0xf14: return csr.mhartid;
		default: throw new Error('csrGet: unknown csr 0x' + offset.toString(16));
	}
}
function csrSet(offset, value) {
	value = value >>> 0;
	switch (offset) {
		case 0x001: csr.fflags = value; break;
		case 0x002: csr.frm = value; break;
		case 0x003: csr.fcsr = value; break;
		case 0x100: csr.sstatus = value; break;
		case 0x104: csr.sie = value; break;
		case 0x105: csr.stvec = value; break;
		case 0x106: csr.scounteren = value; break;
		case 0x140: csr.sscratch = value; break;
		case 0x141: csr.sepc = value; break;
		case 0x142: csr.scause = value; break;
		case 0x143: csr.stval = value; break;
		case 0x144: csr.sip = value; break;
		case 0x180: csr.satp = value; break;
		case 0x300: csr.mstatus = value; break;
		case 0x301: csr.misa = value; break;
		case 0x302: csr.medeleg = value; break;
		case 0x303: csr.mideleg = value; break;
		case 0x304: csr.mie = value; break;
		case 0x305: csr.mtvec = value; break;
		case 0x306: csr.mcountern = value; break;
		case 0x340: csr.mscratch = value; break;
		case 0x341: csr.mepc = value; break;
		case 0x342: csr.mcause = value; break;
		case 0x343: csr.mtval = value; break;
		case 0x344: csr.mip = value; break;
		case 0x3a0: csr.pmpcfg0 = value; break;
		case 0x3b0: csr.pmpaddr0 = value; break;
		case 0xf14: csr.mhartid = value; break;
		case 0xc01: clint.time = Math.floor(clint.time / 4294967296) * 4294967296 + value; break;
		case 0xc81: clint.time = (clint.time % 4294967296) + value * 4294967296; break;
		default: throw new Error('csrSet: unknown csr 0x' + offset.toString(16));
	}
}

// ===== trap =====
function cpu_take_trap(cause, tval) {
	cause = cause >>> 0;

	if (cpu.privilege <= SUPERVISOR
			&& (((cause & 0x80000000) && ((csr.mideleg >>> (cause & 0x7FFFFFFF)) & 1)) || ((~cause & 0x80000000) && ((csr.medeleg >>> cause) & 1)))) {

		csr.sepc = cpu.pc;

		if (cause & 0x80000000) {
			const vectored = (csr.stvec & 3) ? ((cause & 0x7FFFFFFF) << 2) : 0;
			cpu.pc = ((csr.stvec & ~3) + vectored) >>> 0;
		} else {
			cpu.pc = csr.stvec & ~3;
		}

		csr.scause = cause;
		csr.stval = tval >>> 0;

		csr.sstatus &= ~(1 << 5);
		csr.sstatus |= ((csr.sstatus >>> cpu.privilege) & 1) << 5;
		csr.sstatus &= ~(1 << cpu.privilege);

		csr.sstatus &= ~(1 << 8);
		csr.sstatus |= (cpu.privilege << 8);

		cpu.privilege = SUPERVISOR;

	} else {

		csr.mepc = cpu.pc;

		if (cause & 0x80000000) {
			const vectored = (csr.mtvec & 3) ? ((cause & 0x7FFFFFFF) << 2) : 0;
			cpu.pc = ((csr.mtvec & ~3) + vectored) >>> 0;
		} else {
			cpu.pc = csr.mtvec & ~3;
		}

		csr.mcause = cause;
		csr.mtval = tval >>> 0;

		csr.mstatus &= ~(1 << 7);
		csr.mstatus |= ((csr.mstatus >>> cpu.privilege) & 1) << 7;
		csr.mstatus &= ~(1 << cpu.privilege);

		csr.mstatus &= ~(3 << 11);
		csr.mstatus |= (cpu.privilege << 11);

		cpu.privilege = MACHINE;
	}
	csr.sstatus >>>= 0; csr.mstatus >>>= 0;
}

// ===== address translation (sv32) =====
function cpu_addr_translate(addr, except) {
	addr = addr >>> 0;

	const tlbIdx = (addr >>> 12) % TLB_SIZE;

	if (tlbVaddr[tlbIdx] === (addr & ~0xfff) >>> 0 && tlbExcept[tlbIdx] === except) {
		return { ok: true, addr: (tlbPaddr[tlbIdx] | (addr & 0xfff)) >>> 0 };
	}

	if (((csr.satp >>> 31) & 1) && cpu.privilege <= SUPERVISOR) {

		const vpn = [(addr >>> 12) & 0x3FF, (addr >>> 22) & 0x3FF];

		let a = (csr.satp & 0x3FFFFF) << 12;

		for (let i = 1; i >= 0; i--) {

			const pteAddr = ((a | (vpn[i] << 2)) - RAM_BASE) >>> 0;
			const pte = memRead32(pteAddr);

			const v = pte & 1, r = (pte >>> 1) & 1, w = (pte >>> 2) & 1, x = (pte >>> 3) & 1;
			let a_bit = (pte >>> 6) & 1, d_bit = (pte >>> 7) & 1;
			const ppn0 = (pte >>> 10) & 0x3FF, ppn1 = (pte >>> 20) & 0xFFF;

			if (!v) { cpu_take_trap(except, addr); return { ok: false }; }

			if (r || x) {

				if (except === STORE_AMO_PAGE_FAULT && !w) { cpu_take_trap(except, addr); return { ok: false }; }

				if (!a_bit) memWrite32(pteAddr, pte | (1 << 6));
				if (except === STORE_AMO_PAGE_FAULT && !d_bit) memWrite32(pteAddr, memRead32(pteAddr) | (1 << 7));

				tlbVaddr[tlbIdx] = addr & ~0xfff;

				let translated;
				if (i === 1) translated = (((ppn1 << 10) | vpn[0]) << 12) | (addr & 0xfff);
				else translated = (((ppn1 << 10) | ppn0) << 12) | (addr & 0xfff);
				translated = translated >>> 0;

				tlbPaddr[tlbIdx] = translated & ~0xfff;
				tlbExcept[tlbIdx] = except;

				return { ok: true, addr: translated };
			}
			a = (((ppn1 << 10) | ppn0) << 12) >>> 0;
		}

		cpu_take_trap(except, addr);
		return { ok: false };
	}

	return { ok: true, addr };
}

// ===== devices =====
function clint_read(offset) {
	switch (offset) {
		case 0x00004000: return clint.timecmp >>> 0;
		case 0x00004004: return Math.floor(clint.timecmp / 4294967296) >>> 0;
		default: return 0;
	}
}
function clint_write(offset, value) {
	value = value >>> 0;
	switch (offset) {
		case 0x00004000: clint.timecmp = Math.floor(clint.timecmp / 4294967296) * 4294967296 + value; break;
		case 0x00004004: clint.timecmp = (clint.timecmp % 4294967296) + value * 4294967296; break;
	}
}

function plic_read(offset) {
	switch (offset) {
		case 0x00200000: return 0;
		case 0x00200004: {
			let v = 0;
			for (let irq = 1; irq < 32; irq++) if (plic.sclaim & (1 << irq)) v = irq;
			return v;
		}
		default: return 0;
	}
}
function plic_write(offset, value) {
	if (offset === 0x200004) plic.sclaim &= ~(1 << value);
}

function uart1_write(offset, value) {
	value &= 0xff;
	switch (offset) {
		case 0b000:
			if (~uart_com_1.lcr & (1 << 7)) uart_com_1.thr = value; else uart_com_1.dll = value;
			break;
		case 0b001:
			(uart_com_1.lcr & (1 << 7)) ? (uart_com_1.dlm = value) : (uart_com_1.ier = value);
			if (uart_com_1.ier & (1 << 1)) { plic.sclaim |= (1 << 0x05); csr.sip |= (1 << SUPERVISOR_EXTERNAL_INTERRUPT); }
			break;
		case 0b010: uart_com_1.fcr = value; break;
		case 0b011: uart_com_1.lcr = value; break;
		case 0b100: uart_com_1.mcr = value; break;
		case 0b111: uart_com_1.spr = value; break;
		default: throw new Error('uart1_write: bad offset');
	}
}
function uart1_read(offset) {
	switch (offset) {
		case 0b000: { const v = (uart_com_1.lcr & (1 << 7)) ? uart_com_1.dll : uart_com_1.rhr; uart_com_1.lsr &= ~1; return v; }
		case 0b001: return (uart_com_1.lcr & (1 << 7)) ? uart_com_1.dlm : uart_com_1.ier;
		case 0b010: return uart_com_1.isr;
		case 0b011: return uart_com_1.lcr;
		case 0b100: return uart_com_1.mcr;
		case 0b101: return uart_com_1.lsr;
		case 0b110: return uart_com_1.msr;
		case 0b111: return uart_com_1.spr;
		default: throw new Error('uart1_read: bad offset');
	}
}

function virtio_read(offset, size, virtio) {
	switch (offset) {
		case 0x000: return 0x74726976;
		case 0x004: return 2;
		case 0x008: return virtio.dev_id;
		case 0x010: return virtio.dev_feat[virtio.dev_feat_sel];
		case 0x00c: return 0x0000ffff;
		case 0x034: return MAX_VQUEUE_SIZE;
		case 0x044: return virtio.queue[virtio.queue_sel].ready;
		case 0x060: return virtio.int_status;
		case 0x070: return virtio.dev_status;
		case 0x0fc: return 0;
		default:
			if (offset >= 0x100) {
				const o = offset - 0x100;
				if (size === 1) return virtio.config_space[o];
				if (size === 2) return virtio.config_space[o] | (virtio.config_space[o + 1] << 8);
				return (virtio.config_space[o] | (virtio.config_space[o + 1] << 8) | (virtio.config_space[o + 2] << 16) | (virtio.config_space[o + 3] << 24)) >>> 0;
			}
			throw new Error('virtio_read: address not found 0x' + offset.toString(16));
	}
}
function virtio_write(offset, size, value, virtio) {
	value = value >>> 0;
	switch (offset) {
		case 0x014: virtio.dev_feat_sel = value; break;
		case 0x020: virtio.guest_feat[virtio.guest_feat_sel] = value; break;
		case 0x024: virtio.guest_feat_sel = value; break;
		case 0x030: virtio.queue_sel = value; break;
		case 0x038: virtio.queue[virtio.queue_sel].num = value; break;
		case 0x044: virtio.queue[virtio.queue_sel].ready = value; break;
		case 0x050: virtio.queue[value].notify = 1; break;
		case 0x064: virtio.int_status &= ~value; break;
		case 0x070: virtio.dev_status = value; break;
		case 0x080: virtio.queue[virtio.queue_sel].desc_addr = value; break;
		case 0x084: break; /*upper 32 bits of desc_addr; guest is 32-bit, always writes 0 here*/
		case 0x090: virtio.queue[virtio.queue_sel].driver_addr = value; break;
		case 0x094: break;
		case 0x0a0: virtio.queue[virtio.queue_sel].dev_addr = value; break;
		case 0x0a4: break;
		default: throw new Error('virtio_write: address not found 0x' + offset.toString(16));
	}
}

// ===== bus =====
function bus_read(addr, size) {
	addr = addr >>> 0;

	if (addr >= RAM_BASE) {
		const off = (addr - RAM_BASE) >>> 0;
		return size === 1 ? memRead8(off) : size === 2 ? memRead16(off) : memRead32(off);
	}
	if (addr >= CLINT_BASE && addr <= (CLINT_BASE + 0xc0000)) return clint_read(addr - CLINT_BASE);
	if (addr >= PLIC_BASE && addr <= (PLIC_BASE + 0x400000)) return plic_read(addr - PLIC_BASE);
	if (addr >= VIRTIO8_BASE && addr <= (VIRTIO8_BASE + 0x1000)) return virtio_read(addr - VIRTIO8_BASE, size, virtio8_net);
	if (addr >= UART1_BASE && addr <= (UART1_BASE + 0x100)) return uart1_read(addr - UART1_BASE);

			const sectorLo = memRead32((reqOff + 8) >>> 0);
			const sectorHi = memRead32((reqOff + 12) >>> 0);
			const rootfsOff = (sectorLo + sectorHi * 4294967296) * 512;

			const memOff = (d1.addr - RAM_BASE) >>> 0;
			if ((d1.flags & 2) === 0) rootfs.set(ram.subarray(memOff, memOff + d1.len), rootfsOff);
			else ram.set(rootfs.subarray(rootfsOff, rootfsOff + d1.len), memOff);

			ram[(d2.addr - RAM_BASE) >>> 0] = 0x00; /*VIRTIO_BLK_S_OK*/

			qSetUsedRing(q, uidx, ringVal, d1.len);
			uidx = (uidx + 1) & 0xffff;
		}
		qSetUsedIdx(q, uidx);

		plic.sclaim |= (1 << 0x02);
		csr.sip |= (1 << SUPERVISOR_EXTERNAL_INTERRUPT);
		virtio2_blk.int_status |= 1;
	}

	if (virtio3_gpio.queue[0].notify) {
		const q = virtio3_gpio.queue[0];
		q.notify = 0;

		const uidx = qUsedIdx(q);
		const aidx = qAvailIdx(q);
		const ringVal = qAvailRing(q, uidx);
		const d0 = qDesc(q, ringVal);
		const d1 = qDesc(q, d0.next);

		const reqOff = (d0.addr - RAM_BASE) >>> 0;
		const reqType = memRead16(reqOff);
		const reqGpio = memRead16((reqOff + 2) >>> 0);
		const reqValue = memRead32((reqOff + 4) >>> 0);

		let status = 0x01, value = 0x00; /*VIRTIO_GPIO_STATUS_ERR by default*/

		if (reqGpio <= 1) {
			if (reqType === 0x004 /*GET_VALUE*/) { value = gpio_level[reqGpio]; status = 0x00; }
			else if (reqType === 0x005 /*SET_VALUE*/) { gpio_level[reqGpio] = reqValue; status = 0x00; }
			else if (reqType === 0x002 || reqType === 0x003) status = 0x00; /*GET/SET_DIRECTION: no real GPIO, just ack*/
		}

		const respOff = (d1.addr - RAM_BASE) >>> 0;
		ram[respOff] = status;
		ram[respOff + 1] = value;

		qSetUsedRing(q, uidx, ringVal, 2);
		qSetUsedIdx(q, (uidx + 1) & 0xffff);

		plic.sclaim |= (1 << 0x03);
		csr.sip |= (1 << SUPERVISOR_EXTERNAL_INTERRUPT);
		virtio3_gpio.int_status |= 1;
	}

	if (virtio8_net.queue[1].notify) {
		const q = virtio8_net.queue[1];
		q.notify = 0;

		let uidx = qUsedIdx(q);
		const aidx = qAvailIdx(q);

		while (uidx !== aidx) {
			const ringVal = qAvailRing(q, uidx);
			const d = qDesc(q, ringVal);
			qSetUsedRing(q, uidx, ringVal, d.len); /*no network backend: packet dropped*/
			uidx = (uidx + 1) & 0xffff;
		}
		qSetUsedIdx(q, uidx);
	}

	const inBytes = virtio1_console.queue[0].notify ? host.consoleRead() : null;
	if (inBytes && inBytes.length) {
		const q = virtio1_console.queue[0];
		q.notify = 0;

		const uidx = qUsedIdx(q);
		const aidx = qAvailIdx(q);
		const ringVal = qAvailRing(q, uidx);
		const d = qDesc(q, ringVal);
		const off = (d.addr - RAM_BASE) >>> 0;

		ram.set(inBytes, off);

		qSetUsedRing(q, uidx, ringVal, inBytes.length);
		qSetUsedIdx(q, (uidx + 1) & 0xffff);

		plic.sclaim |= (1 << 0x01);
		csr.sip |= (1 << SUPERVISOR_EXTERNAL_INTERRUPT);
		virtio1_console.int_status |= 1;
	}
}

function setFeat64(virtio, bigVal) {
	virtio.dev_feat[0] = Number(bigVal & 0xffffffffn) >>> 0;
	virtio.dev_feat[1] = Number((bigVal >> 32n) & 0xffffffffn) >>> 0;
}

// ===== app_main equivalent =====
// assets = { bbl32: Uint8Array, image: Uint8Array, dtb: Uint8Array, rootfs: Uint8Array (mutable, in-memory disk) }
function boot(assets, host) {
	hostRef = host;
	rootfs = assets.rootfs;

	csr.misa = ((1 << 0) | (1 << 2) | (1 << 3) | (1 << 8) | (1 << 12) | (1 << 18) | (1 << 20) | (1 << 30)) >>> 0;

	setFeat64(virtio1_console, 1n << 32n);

	setFeat64(virtio2_blk, 1n << 32n);
	virtio2_blk.config_space = new Uint8Array(72);
	new DataView(virtio2_blk.config_space.buffer).setBigUint64(0, BigInt(Math.floor(assets.rootfs.length / 512)), true);

	setFeat64(virtio3_gpio, 1n << 32n);
	virtio3_gpio.config_space = new Uint8Array(8);
	new DataView(virtio3_gpio.config_space.buffer).setUint16(0, 2, true); /*ngpio*/

	setFeat64(virtio4_i2c, (1n << 0n) | (1n << 32n));

	setFeat64(virtio8_net, (1n << 3n) | (1n << 5n) | (1n << 32n));
	virtio8_net.config_space = new Uint8Array(24);
	virtio8_net.config_space.set([0x02, 0x00, 0x00, 0x00, 0x00, 0x01], 0); /*mac*/
	new DataView(virtio8_net.config_space.buffer).setUint16(10, 576, true); /*mtu*/

	low.set(assets.dtb.subarray(0, Math.min(4096, assets.dtb.length)));

	ram.set(assets.bbl32, 0x00000000);
	ram.set(assets.image, 0x00400000);
}

// ===== browser harness =====

const termEl = document.getElementById('term');
const statusEl = document.getElementById('status');

function termWrite(text) {
	termEl.textContent += text;
	termEl.scrollTop = termEl.scrollHeight;
}

const decoder = new TextDecoder('utf-8', { fatal: false });
let pendingByte = null;

const inputQueue = [];

const host = {
	now: () => performance.now() * 1000 * 240, /*matches the 240MHz clint.time scale used by the original firmware*/
	consoleWrite: (bytes) => {
		termWrite(decoder.decode(bytes, { stream: true }));
	},
	consoleRead: () => {
		if (!inputQueue.length) return null;
		return new Uint8Array(inputQueue.splice(0, 16));
	},
	exit: (code) => {
		statusEl.textContent = 'guest requested poweroff/reboot (code ' + code + ') — reload the page to restart';
		running = false;
	},
};

termEl.addEventListener('keydown', (ev) => {
	ev.preventDefault();
	const map = { Enter: 13, Backspace: 127, Tab: 9, Escape: 27 };
	if (map[ev.key] !== undefined) { inputQueue.push(map[ev.key]); return; }
	if (ev.ctrlKey && ev.key.length === 1) {
		const c = ev.key.toUpperCase().charCodeAt(0);
		if (c >= 65 && c <= 90) { inputQueue.push(c - 64); return; }
	}
	if (ev.key.length === 1) {
		const bytes = new TextEncoder().encode(ev.key);
		for (const b of bytes) inputQueue.push(b);
	}
});
termEl.addEventListener('click', () => termEl.focus());

document.getElementById('led0');
function updateGpioLeds() {
	document.getElementById('led0').classList.toggle('on', !!gpio_level[0]);
	document.getElementById('led1').classList.toggle('on', !!gpio_level[1]);
}
document.getElementById('btn0').addEventListener('click', () => { gpio_level[0] = gpio_level[0] ? 0 : 1; updateGpioLeds(); });
document.getElementById('btn1').addEventListener('click', () => { gpio_level[1] = gpio_level[1] ? 0 : 1; updateGpioLeds(); });
document.getElementById('btnReset').addEventListener('click', () => location.reload());

let running = false;

function frame() {
	if (!running) return;
	const budget = performance.now() + 12; /*ms per step kept for cpu batches, leaving headroom for rendering*/
	while (performance.now() < budget) {
		tickCpu(host);
		tickVirtio(host);
	}
	updateGpioLeds();
	setTimeout(frame, 0); /*setTimeout instead of requestAnimationFrame: keeps running in background tabs, where rAF gets throttled/paused*/
}

statusEl.textContent = 'downloading images (bbl32, kernel, rootfs, dtb)…';

Promise.all([
	fetch('data/bbl32.bin').then(r => r.arrayBuffer()),
	fetch('data/Image').then(r => r.arrayBuffer()),
	fetch('data/riscv_emulator.dtb').then(r => r.arrayBuffer()),
	fetch('data/rootfs.ext2').then(r => r.arrayBuffer()),
]).then(([bbl32, image, dtb, rootfs]) => {
	const assets = {
		bbl32: new Uint8Array(bbl32),
		image: new Uint8Array(image),
		dtb: new Uint8Array(dtb),
		rootfs: new Uint8Array(rootfs),
	};

	boot(assets, host);
	updateGpioLeds();

	statusEl.textContent = 'running — RV32IMAFDC + virtio-mmio (console, blk, gpio)';
	running = true;
	termEl.focus();
	frame();
}).catch(err => {
	statusEl.textContent = 'error loading images: ' + err.message;
});
</script>
